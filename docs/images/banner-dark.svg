<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0f1c1e"/>
    <!-- sedimentary strata -->
    <path d="M0 268 C 220 248, 420 290, 640 270 S 1000 240, 1200 262 V 360 H 0 Z" fill="#132527"/>
    <path d="M0 300 C 260 286, 460 318, 700 302 S 1020 282, 1200 296 V 360 H 0 Z" fill="#173234"/>
    <path d="M0 330 C 240 322, 520 344, 760 332 S 1040 318, 1200 328 V 360 H 0 Z" fill="#1d4442"/>
    <g fill="#5fc4bf" opacity="0.22">
      <circle cx="120" cy="318" r="3"/><circle cx="190" cy="326" r="2"/><circle cx="330" cy="312" r="2.5"/>
      <circle cx="520" cy="322" r="3"/><circle cx="610" cy="314" r="2"/><circle cx="880" cy="306" r="2.5"/>
      <circle cx="1010" cy="316" r="3"/><circle cx="1120" cy="310" r="2"/>
    </g>

    <!-- logo + title -->
    <g transform="translate(72 56)">
      <rect width="88" height="88" rx="18" fill="#087c82"/>
      <text x="44" y="60" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" letter-spacing="-2">PB</text>
      <circle cx="80" cy="80" r="9" fill="#c6dfd3" stroke="#0f1c1e" stroke-width="3.5"/>
    </g>
    <text x="72" y="222" fill="#eef4f2" font-size="54" font-weight="700" letter-spacing="-1.5">PetroBowl Trainer</text>
    <text x="74" y="262" fill="#9fb3b2" font-size="22">Offline study and team practice for PetroBowl</text>

    <!-- flashcard -->
    <g transform="translate(724 46)" filter="url(#lift)">
      <rect width="404" height="236" rx="16" fill="#172a2c" stroke="#26403f"/>
      <text x="28" y="40" fill="#8ea3a2" font-size="12" font-weight="600" letter-spacing="2">GEOLOGY</text>
      <text x="28" y="72" fill="#e4eeec" font-size="18" font-weight="600">Which rock property is the fraction</text>
      <text x="28" y="96" fill="#e4eeec" font-size="18" font-weight="600">of bulk volume occupied by pores?</text>
      <line x1="28" y1="116" x2="376" y2="116" stroke="#26403f"/>
      <text x="28" y="142" fill="#8ea3a2" font-size="11" font-weight="600" letter-spacing="2">ANSWER</text>
      <text x="28" y="170" fill="#5fc4bf" font-size="26" font-weight="700">porosity</text>
      <g font-size="12" text-anchor="middle">
        <rect x="28" y="186" width="80" height="32" rx="7" fill="#2a1f1d" stroke="#4a312b"/>
        <text x="68" y="207" fill="#e3a091" font-weight="600">Again</text>
        <rect x="116" y="186" width="80" height="32" rx="7" fill="#27251d" stroke="#463f2b"/>
        <text x="156" y="207" fill="#d6c08a" font-weight="600">Hard</text>
        <rect x="204" y="186" width="80" height="32" rx="7" fill="#14302f" stroke="#24504c"/>
        <text x="244" y="207" fill="#7fd3cd" font-weight="600">Good</text>
        <rect x="292" y="186" width="84" height="32" rx="7" fill="#087c82"/>
        <text x="334" y="207" fill="#ffffff" font-weight="600">Easy</text>
      </g>
    </g>
  </g>
</svg>
